name: 定期再ビルド（選挙期ガード・基準日の反映）

# 本サイトは静的生成のため、選挙期間中バナー（公選法配慮）や「データ基準日」は
# **ビルドした時点**で固定される。告示日を過ぎてもビルドしなければガードは出ない。
# そのため毎日 1 回、本番を再ビルド・再デプロイして判定を更新する。
#
# 必要な設定（リポジトリの Secrets）:
#   CLOUDFLARE_DEPLOY_HOOK … Cloudflare Pages の「デプロイフック」URL
#   （Pages プロジェクト → Settings → Builds & deployments → Deploy hooks で発行）
#   ※ フックURLだけで済むため、APIトークンをGitHubに置く必要はない。

on:
  schedule:
    - cron: "0 20 * * *" # 毎日 20:00 UTC ＝ 日本時間 翌 5:00
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare Pages の再ビルドを要求
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK が未設定です。Pages のデプロイフックURLを Secrets に登録してください。"
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
          echo "再ビルドを要求しました。"
